<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Reports</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h2 { color: #38bdf8; }
        .report-card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; }
        .report-header { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .back-btn { display: inline-block; background: #334155; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 6px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin" class="back-btn">← Back to Admin Dashboard</a>
        <h2>User Support Reports</h2>

        {% if reports %}
            {% for r in reports %}
            <div class="report-card">
                <div class="report-header">
                    <span><strong>Email:</strong> {{ r[1] }} | <strong>Phone:</strong> {{ r[2] }}</span>
                    <span>{{ r[4] }}</span>
                </div>
                <p style="margin: 0; color: #cbd5e1; line-height: 1.5;">{{ r[3] }}</p>
            </div>
            {% endfor %}
        {% else %}
            <div class="report-card" style="text-align: center; color: #94a3b8;">
                <p>No reports submitted yet.</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
